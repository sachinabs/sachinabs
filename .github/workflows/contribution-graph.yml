name: Generate Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribution-graph:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate contribution graph
        uses: alexcerezo/activity-graph@v1

      - name: Check generated files
        run: |
          echo "Repository files:"
          ls -la

          echo "Checking activity graph:"
          if [ -f activity-graph.svg ]; then
            echo "activity-graph.svg exists"
            ls -lh activity-graph.svg
          else
            echo "activity-graph.svg NOT FOUND"
            exit 1
          fi

      - name: Commit contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add activity-graph.svg activity-graph-mobile.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update GitHub contribution graph"
            git push origin main
          fi